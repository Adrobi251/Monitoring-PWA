<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#176B52">
    <title>Offline · Konsultasi Akademik</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #F7F9F8;
            --surface: #FFFFFF;
            --text: #17352B;
            --muted: #718078;
            --primary: #176B52;
            --primary-dark: #104C3D;
            --border: #E3EAE6;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0F1D18;
                --surface: #16261F;
                --text: #E8F1EC;
                --muted: #9FB0A7;
                --border: #26382F;
            }
        }

        * { box-sizing: border-box; }

        body {
            font-family: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
        }

        .offline-card {
            width: 100%;
            max-width: 26rem;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(23, 53, 43, 0.06);
            padding: 2.5rem 1.75rem;
        }

        .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 4rem;
            height: 4rem;
            border-radius: 9999px;
            background: rgba(23, 107, 82, 0.1);
            color: var(--primary);
            margin-bottom: 1.25rem;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0 0 0.5rem;
        }

        p {
            color: var(--muted);
            font-size: 0.875rem;
            line-height: 1.6;
            margin: 0;
        }

        button {
            margin-top: 1.5rem;
            width: 100%;
            border: 0;
            border-radius: 10px;
            background: var(--primary);
            color: #FFFFFF;
            font: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            padding: 0.8rem 1rem;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        button:hover { background: var(--primary-dark); }

        button:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .hint {
            margin-top: 1rem;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <main class="offline-card">
        <span class="icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
                <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
                <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
                <path d="M5 12.55a10 10 0 0 1 5.17-2.39" />
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
                <path d="M12 20h.01" />
                <path d="m2 2 20 20" />
            </svg>
        </span>

        <h1>Tidak ada koneksi internet</h1>
        <p>Periksa jaringan Anda, lalu coba lagi. Data konsultasi tidak dapat diakses saat offline.</p>

        <button type="button" onclick="window.location.reload()">Coba Lagi</button>
        <p class="hint">Halaman akan dimuat ulang otomatis saat koneksi kembali.</p>
    </main>

    <script>
        window.addEventListener('online', () => window.location.reload());
    </script>
</body>
</html>
