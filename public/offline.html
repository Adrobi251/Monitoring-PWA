<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .offline-box {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-width: 90%;
        }
        h1 {
            color: #1f2937;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        p {
            color: #6b7280;
            font-size: 1rem;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="offline-box">
        <h1>Offline</h1>
        <p>Anda tidak memiliki koneksi internet. Namun aplikasi tetap dapat diakses.</p>
    </div>
</body>
</html>
